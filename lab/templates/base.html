<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
<header class="top">
  <h1>{{ site_name }}</h1>
  <nav>
    {% for item in pages %}<a href="{{ item.path }}"{% if item.key == page.key %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
